[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiorise-mcp"
version = "0.2.0"
description = "AudioRise MCP server (stdio): probe/separate/label/summarize, jailed paths"
requires-python = ">=3.10"
dependencies = ["audiorise-core", "mcp>=2.0"]
license = { text = "MIT" }

[project.scripts]
audiorise-mcp = "audio_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
