[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiorise-cli"
version = "0.1.0"
description = "AudioRise CLI: `audiorise` command"
requires-python = ">=3.10"
dependencies = ["audiorise-core"]
license = { text = "MIT" }

[project.scripts]
audiorise = "audio_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
