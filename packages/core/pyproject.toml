[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiorise-core"
version = "0.5.0"
description = "AudioRise core engine: probe + local Demucs separation + heuristic labels"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
separation = ["torch", "torchaudio", "demucs", "soundfile", "numpy"]
label = ["soundfile", "numpy"]
transcription = ["muscriptor", "mido"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
